name: "Bug"
description: Reportar un fallo o comportamiento inesperado
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: componente
    attributes:
      label: Componente afectado
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del bug
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Bloqueante
        - Alta
        - Media
        - Baja
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, trazas o evidencias
