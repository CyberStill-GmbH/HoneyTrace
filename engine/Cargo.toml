[package]
name = "honeytrace-engine"
version = "0.1.0"
edition = "2021"
description = "Contratos Rust para correlación y reconstrucción de ataques en HoneyTrace"
license = "MIT"

[lib]
name = "honeytrace_engine"
path = "src/lib.rs"

[[bin]]
name = "honeytrace-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
